[package]
name = "pathsum-eq"
version = "0.1.0"
edition = "2021"
description = "Quantum circuit equivalence checking via path-sums and weighted model counting"
license = "MIT"

[[bin]]
name = "pathsum-eq"
path = "src/main.rs"

[dependencies]
num-bigint = "0.4"
num-integer = "0.1"
num-rational = "0.4"
num-traits = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-time = "1"
