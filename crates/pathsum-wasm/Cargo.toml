[package]
name = "pathsum-wasm"
version = "0.1.0"
edition = "2021"
description = "WebAssembly bindings for the path-sum equivalence checker"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pathsum-eq = { path = "../pathsum-eq" }
wasm-bindgen = "=0.2.100"
serde_json = "1"
console_error_panic_hook = "0.1"
