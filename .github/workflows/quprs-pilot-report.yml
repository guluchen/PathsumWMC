name: Archive isolated exact-candidate diagnostic
on:
  workflow_dispatch:
    inputs:
      comparison_run:
        required: true
        default: '43625065429'
permissions:
  actions: read
  contents: write
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Require all fixed cells and isolate this timing generation
        run: |
          set -euo pipefail
          gh run view '${{ inputs.comparison_run }}' --json conclusion --jq .conclusion | grep -x success
          gh run download '${{ inputs.comparison_run }}' --pattern 'quprs-comparison-[0-9]*' --dir raw
          python3 - <<'PY'
          import json,pathlib
          files=list(pathlib.Path('raw').rglob('metadata.json'))
          assert len(files)==12,len(files)
          for p in files:
            d=json.loads(p.read_text());assert d['timing_protocol']=='isolated-chromium-v2',p
          PY
          python3 scripts/summarize-quprs-compare.py raw results --plan benchmarks/quprs-compare/performance-pilot.json
          cp benchmarks/quprs-compare/performance-pilot.json benchmarks/paper-2026/manifest.json results/
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('results');d=json.loads((p/'results.json').read_text())
          assert d['complete'] and d['recorded_cells']==48
          assert not d['unstable_status'] and not d['unstable_verdict'] and not d['interval_conflicts']
          notes='Fixed preselected diagnostic panel, not a full-suite win claim. Every WASM trial uses a fresh Chromium process which is closed before any subsequent native/original/WASM sample; browser launch and teardown are excluded and recorded separately. Earlier reused-browser timings are superseded and never pooled. Functional exact candidate source d563342/670b985; frozen validation43613464526; original paper-era Python QuPRS60bcb250 (not current Rustv0.16). The exact candidate remains experimental; public PathsumWMC calculation code is unchanged.\n\n'
          f=p/'RESULTS.md';f.write_text(notes+f.read_text())
          record={'comparison_run':'${{ inputs.comparison_run }}','report_source':'${{ github.sha }}','candidate_validation_run':43613464526,'candidate_functional_source':'670b985','numerical_contracts_differ':True,'timing_protocol':'isolated-chromium-v2','superseded_reused_browser_pilot':43614116593}
          (p/'PROVENANCE.json').write_text(json.dumps(record,indent=2)+'\n')
          PY
          tar -czf exact-isolated-pilot-raw.tar.gz raw results
          git archive --format=tar HEAD | gzip > exact-candidate-complete-source.tar.gz
          sha256sum exact-isolated-pilot-raw.tar.gz exact-candidate-complete-source.tar.gz > SHA256SUMS
          gh release create exact-isolated-pilot-20261115 --target '${{ github.sha }}' --title 'Exact candidate isolated diagnostic panel — 2026-11-15' --notes-file results/RESULTS.md exact-isolated-pilot-raw.tar.gz exact-candidate-complete-source.tar.gz SHA256SUMS results/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-pilot-summary
          path: results
